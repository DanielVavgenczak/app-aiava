# MESMO ARQUIVO DO LOCAL, SÓ REMOVENDO:
# - user: "1001:1001"
# - bind mounts (..:/var/www/html)
# - portas de dev (5173)

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iava_app
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - database
      - redis
    networks:
      - iava_network

  webserver:
    image: nginx:alpine
    container_name: iava_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage
    networks:
      - iava_network
    depends_on:
      - app

  database:
    image: postgres:16
    container_name: iava_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-iava}
      POSTGRES_USER: ${DB_USERNAME:-iava_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iava_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iava_network

  redis:
    image: redis:7-alpine
    container_name: iava_redis
    restart: unless-stopped
    networks:
      - iava_network

volumes:
  postgres_data:
  storage_data:

networks:
  iava_network:
    driver: bridge
