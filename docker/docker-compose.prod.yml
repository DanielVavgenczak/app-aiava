  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iava_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - iava_network
    depends_on:
      - database
      - redis

  webserver:
    image: nginx:alpine
    container_name: iava_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage
    networks:
      - iava_network
    depends_on:
      - app
