services:
  app:
    image: ghcr.io/danielvavgenczak/app-aiava:${IMAGE_TAG:-latest}
    container_name: iava_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - database
      - redis
    networks:
      - iava_network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webserver:
    image: nginx:alpine
    container_name: iava_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage
    networks:
      - iava_network
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  database:
    image: postgres:16
    container_name: iava_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-iava}
      POSTGRES_USER: ${DB_USERNAME:-iava_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iava_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iava_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: iava_redis
    restart: unless-stopped
    networks:
      - iava_network

volumes:
  postgres_data:
  storage_data:

networks:
  iava_network:
    driver: bridge
