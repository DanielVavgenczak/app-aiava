version: '3.8'
services:
  app:
    user: "1001:1001"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ailumnus_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
      - storage_data:/var/www/html/storage/app
      - video_uploads:/var/www/html/storage/app/public/videos
    environment:
      - DB_HOST=database
      - REDIS_HOST=redis
    networks:
      - ailumnus_network

  webserver:
    image: nginx:alpine
    container_name: ailumnus_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage/app
      - video_uploads:/var/www/html/storage/app/public/videos
    networks:
      - ailumnus_network
    depends_on:
      - app

  database:
    image: postgres:16
    container_name: ailumnus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ailumnus
      POSTGRES_USER: ailumnus_user
      POSTGRES_PASSWORD: ailumnus_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ailumnus_network

  redis:
    image: redis:7-alpine
    container_name: ailumnus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ailumnus_network

volumes:
  postgres_data:
  storage_data:
  video_uploads:

networks:
  ailumnus_network:
    driver: bridge