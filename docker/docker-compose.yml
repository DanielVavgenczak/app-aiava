services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iava_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
      - storage_data:/var/www/html/storage
    ports:
      - "5173:5173"
      - "8080:8080"
    environment:
      - DB_HOST=database
      - REDIS_HOST=redis
    networks:
      - iava_network

  webserver:
    image: nginx:alpine
    container_name: iava_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ..:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage
    networks:
      - iava_network
    depends_on:
      - app

  database:
    image: postgres:16
    container_name: iava_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iava
      POSTGRES_USER: iava_user
      POSTGRES_PASSWORD: iava_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iava_network

  redis:
    image: redis:7-alpine
    container_name: iava_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - iava_network

volumes:
  postgres_data:
  storage_data:

networks:
  iava_network:
    driver: bridge
