services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iava_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ../.env
    # user: "1001:1001"          # ← DIFERENÇA 1: Seu UID local (remove em prod)
    volumes:
      - ..:/var/www/html       # ← DIFERENÇA 2: Bind mount para dev (remove em prod)
      - storage_data:/var/www/html/storage
    ports:
      - "5173:5173"            # ← DIFERENÇA 3: Portas de dev (Vite/Reverb)
      - "8080:8080"
    depends_on:
      - database
      - redis
    networks:
      - iava_network

  webserver:
    image: nginx:alpine
    container_name: iava_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ..:/var/www/html       # ← Mantém bind mount local (remove em prod)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage
    networks:
      - iava_network
    depends_on:
      - app

  database:
    image: postgres:16
    container_name: iava_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-iava}
      POSTGRES_USER: ${DB_USERNAME:-iava_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iava_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iava_network

  redis:
    image: redis:7-alpine
    container_name: iava_redis
    restart: unless-stopped
    networks:
      - iava_network

volumes:
  postgres_data:
  storage_data:

networks:
  iava_network:
    driver: bridge
