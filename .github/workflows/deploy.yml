name: CI/CD IAVA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: iava-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Prepare bootstrap/cache
        run: mkdir -p bootstrap/cache && chmod -R 775 bootstrap/cache
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: npm ci
      - run: cp .env.example .env || true
      - run: php artisan key:generate --env=testing || true
      - run: npm run build --if-present
      - run: npm run test:js
      - run: vendor/bin/pest --parallel

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/danielvavgenczak/app-aiava:latest
            ghcr.io/danielvavgenczak/app-aiava:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/iava

            mkdir -p backups
            if docker compose -f docker/docker-compose.prod.yml ps -q database >/dev/null 2>&1; then
              docker compose -f docker/docker-compose.prod.yml exec -T database sh -c 'pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"' > backups/db_$(date +%Y%m%d_%H%M%S).dump
            fi
            cp -n .env backups/env_$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
            ls -1t backups/db_*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f

            git fetch origin main
            git checkout -q ${{ github.sha }}

            docker compose -f docker/docker-compose.prod.yml pull app
            docker compose -f docker/docker-compose.prod.yml up -d --no-build

            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/up || echo 000)
              [ "$code" = "200" ] && break
              sleep 2
            done
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/up || echo 000)
            [ "$code" = "200" ] || { echo "Healthcheck falhou ($code)"; exit 1; }

            docker compose -f docker/docker-compose.prod.yml exec -T app php artisan migrate --force --no-interaction

            docker compose -f docker/docker-compose.prod.yml exec -T app chown -R www-data:www-data storage bootstrap/cache
            docker compose -f docker/docker-compose.prod.yml exec -T -u www-data app php artisan optimize:clear
            docker compose -f docker/docker-compose.prod.yml exec -T -u www-data app php artisan config:cache
            docker compose -f docker/docker-compose.prod.yml exec -T -u www-data app php artisan route:cache
            docker compose -f docker/docker-compose.prod.yml exec -T -u www-data app php artisan view:cache
            docker compose -f docker/docker-compose.prod.yml exec -T app chown -R www-data:www-data storage bootstrap/cache

            docker image prune -f
            echo "✅ Deploy concluído"
