name: Deploy IAVA

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/iava

            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker/docker-compose.prod.yml down --remove-orphans
            docker compose -f docker/docker-compose.prod.yml build --no-cache
            docker compose -f docker/docker-compose.prod.yml up -d

            sleep 15

            docker compose -f docker/docker-compose.prod.yml run --rm app php artisan migrate --force --no-interaction
            docker compose -f docker/docker-compose.prod.yml run --rm app php artisan config:cache

            # Health check que FALHA o deploy se o site não responder 200/302
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://iava_nginx)
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
              echo "❌ Site não respondeu corretamente: HTTP $HTTP_CODE"
              exit 1
            fi
            echo "✅ Deploy validado: HTTP $HTTP_CODE"
