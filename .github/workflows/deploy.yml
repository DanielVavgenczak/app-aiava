name: Deploy IAVA

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/iava

            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker/docker-compose.prod.yml down --remove-orphans
            docker compose -f docker/docker-compose.prod.yml build --no-cache
            docker compose -f docker/docker-compose.prod.yml up -d

            sleep 15

            docker compose -f docker/docker-compose.prod.yml exec -T app sh -c "grep -q 'APP_KEY=base64' .env || php artisan key:generate --force"
            docker compose -f docker/docker-compose.prod.yml exec -T app php artisan migrate --force --no-interaction
            docker compose -f docker/docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker/docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker/docker-compose.prod.yml exec -T app php artisan view:cache

            NGINX_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' iava_nginx)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$NGINX_IP || echo "000")
            echo "✅ Deploy concluído: HTTP $HTTP_CODE"
